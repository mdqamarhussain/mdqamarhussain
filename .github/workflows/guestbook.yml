name: Guestbook

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Process one signature at a time so two visitors can't overwrite each other
concurrency:
  group: guestbook
  cancel-in-progress: false

jobs:
  sign:
    if: startsWith(github.event.issue.title, 'Guestbook')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add entry to README
        id: sign
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const user = issue.user.login;

            // Message = whatever follows "Guestbook:" in the title, cleaned up
            let msg = issue.title.replace(/^Guestbook:?\s*/i, '');
            msg = msg
              .replace(/https?:\/\/\S+/gi, '')          // no links
              .replace(/[<>\[\]()`|*_~#\\@]/g, '')      // no markdown / HTML / mentions
              .replace(/[\u0000-\u001f\u007f]/g, '')    // no control characters
              .replace(/\s+/g, ' ')
              .trim()
              .slice(0, 100);

            if (!msg) {
              core.setOutput('ok', 'false');
              return;
            }

            const start = '<!-- GUESTBOOK:START -->';
            const end = '<!-- GUESTBOOK:END -->';
            const md = fs.readFileSync('README.md', 'utf8');
            const s = md.indexOf(start);
            const e = md.indexOf(end);
            if (s < 0 || e < 0) throw new Error('Guestbook markers not found in README.md');

            const existing = md
              .slice(s + start.length, e)
              .split('\n')
              .filter(l => l.startsWith('- ') && !l.includes('Nobody here yet'));

            const date = new Date().toISOString().slice(0, 10);
            const entry = `- **[@${user}](https://github.com/${user})** · ${date} · ${msg}`;
            const list = [entry, ...existing].slice(0, 5); // keep the latest 5

            const out = md.slice(0, s + start.length) + '\n' + list.join('\n') + '\n' + md.slice(e);
            fs.writeFileSync('README.md', out);
            core.setOutput('ok', 'true');

      - name: Commit README
        if: steps.sign.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "guestbook: new signature" && git pull --rebase && git push)

      - name: Thank the visitor and close the issue
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.sign.outputs.ok }}' === 'true';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: ok
                ? 'Thanks for signing the guestbook! 🎮 You are now on the profile page.'
                : 'Your message came out empty after cleaning (links and special characters are removed). Try again with plain text after "Guestbook:".'
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: ok ? 'completed' : 'not_planned'
            });
